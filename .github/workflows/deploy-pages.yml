name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove server-only routes (not supported on GitHub Pages)
        run: rm -rf src/app/api src/app/admin src/middleware.ts

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          # Optional: owner KakaoTalk notify worker URL (Settings → Variables → Actions)
          NEXT_PUBLIC_KAKAO_NOTIFY_URL: ${{ vars.KAKAO_NOTIFY_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # 배포가 끝나면 네이버(서치어드바이저)·빙에 "페이지가 바뀌었으니 수집해 달라"고 알림 (IndexNow)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify Naver & Bing via IndexNow
        continue-on-error: true
        run: |
          sleep 30
          BODY='{"host":"jinoski.com","key":"606c479ad57b56f20eb559d238c6cc98","keyLocation":"https://jinoski.com/606c479ad57b56f20eb559d238c6cc98.txt","urlList":["https://jinoski.com/ko/","https://jinoski.com/ko/lessons/","https://jinoski.com/ko/pricing/","https://jinoski.com/ko/instructor/","https://jinoski.com/ko/gallery/","https://jinoski.com/ko/snap/","https://jinoski.com/ko/reviews/","https://jinoski.com/ko/faq/","https://jinoski.com/ko/reserve/","https://jinoski.com/en/","https://jinoski.com/zh/"]}'
          for EP in https://searchadvisor.naver.com/indexnow https://api.indexnow.org/indexnow; do
            echo "== $EP"
            curl -sS -w "\nHTTP %{http_code}\n" -X POST "$EP" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
          done
